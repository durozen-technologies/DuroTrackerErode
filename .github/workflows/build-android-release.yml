name: Build Production Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://erode.durozen.in/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Normalize PNG icons (Fix AAPT2 Error)
        working-directory: ./frontend
        run: |
          find assets -type f -iname "*.png" -exec mogrify -strip -interlace none -colorspace sRGB {} +

      - name: Expo Prebuild
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean

      - name: Generate Debug Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Release APK with Gradle
        working-directory: ./frontend/android
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "android.r8.maxWorkers=1" >> gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android --no-daemon --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duro-Tracker-Production-App
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
